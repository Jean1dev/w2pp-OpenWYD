syntax = "proto3";

// Internal contract between tmServer and dbServer (migration-plan.md §3.5).
// This link is modern (gRPC + mTLS), NOT the legacy CPSock — only the client
// edge is bound to the old protocol. The RPCs mirror the legacy G↔DB messages
// in protocol-spec.md §3.3 (DBAccountLogin, DBCharacterLogin, DBSaveMob, …).
//
// Code generation and the server implementation land in Phase 3, when tmServer
// becomes the consumer. Generate with `make proto`.
package db.v1;

option go_package = "github.com/jeanluca/w2pp-openwyd/api/db/v1;dbv1";

// AccountService owns accounts, characters and persistence (PostgreSQL).
service AccountService {
  // AccountLogin validates an account name + password (legacy _MSG_DBAccountLogin).
  rpc AccountLogin(AccountLoginRequest) returns (AccountLoginResponse);
  // ListCharacters returns the character-selection projection for an account.
  rpc ListCharacters(ListCharactersRequest) returns (ListCharactersResponse);
  // LoadCharacter loads one character's full state by slot (_MSG_DBCharacterLogin).
  rpc LoadCharacter(LoadCharacterRequest) returns (LoadCharacterResponse);
  // SaveCharacter persists one character's state (_MSG_DBSaveMob / SavingQuit).
  rpc SaveCharacter(SaveCharacterRequest) returns (SaveCharacterResponse);
  rpc QuoteKingdomCape(QuoteKingdomCapeRequest) returns (QuoteKingdomCapeResponse);
  rpc PurchaseKingdomCape(PurchaseKingdomCapeRequest) returns (PurchaseKingdomCapeResponse);
  // CreateCharacter creates a character in a free slot (_MSG_DBCreateCharacter).
  rpc CreateCharacter(CreateCharacterRequest) returns (CreateCharacterResponse);
  // CreateArchCharacter creates the ARCH twin in the first free account slot
  // (_MSG_DBCreateArchCharacter).
  rpc CreateArchCharacter(CreateArchCharacterRequest) returns (CreateArchCharacterResponse);
  // DeleteCharacter deletes a character after password confirmation.
  rpc DeleteCharacter(DeleteCharacterRequest) returns (DeleteCharacterResponse);
  // SetPin sets (or changes) the account's numeric PIN, stored as an argon2id
  // hash — never plaintext (legacy _MSG_AccountSecure change path).
  rpc SetPin(SetPinRequest) returns (SetPinResponse);
  // VerifyPin checks a numeric PIN against the stored hash (legacy
  // _MSG_AccountSecure verify path); NOT_SET means the account has no PIN yet.
  rpc VerifyPin(VerifyPinRequest) returns (VerifyPinResponse);
  // LoadCargo loads the account-shared cargo (warehouse) gold + items. The cargo
  // is owned by the account, not a single character (all 4 chars share it).
  rpc LoadCargo(LoadCargoRequest) returns (LoadCargoResponse);
  // SaveCargo persists the account-shared cargo gold + items (replace-all).
  rpc SaveCargo(SaveCargoRequest) returns (SaveCargoResponse);
  // ListPendingDeliveries returns the account's pending item grants from the
  // delivery_queue mailbox (donate web shop, issue #34). tmServer drains them
  // into the account cargo inside its loop at login, then acks the outcome via
  // SaveCargoWithDeliveries.
  rpc ListPendingDeliveries(ListPendingDeliveriesRequest) returns (ListPendingDeliveriesResponse);
  // SaveCargoWithDeliveries persists the cargo (replace-all, like SaveCargo) and
  // marks the drained mailbox rows delivered/lost in the SAME transaction — the
  // anti-dup boundary for the drain (web-platform-plan.md §mailbox).
  rpc SaveCargoWithDeliveries(SaveCargoWithDeliveriesRequest) returns (SaveCargoResponse);
  // SetAccountBlocked flips account.is_blocked by account name — the write side of
  // the in-game GM ban/unban command (issue #122). Login already rejects blocked
  // accounts (LOGIN_RESULT_BLOCKED), so a ban denies re-login immediately and an
  // unban restores it. Administrative-ban ownership may later move to binServer
  // entitlement (web-platform-plan.md §binServer); until then this is the gate.
  rpc SetAccountBlocked(SetAccountBlockedRequest) returns (SetAccountBlockedResponse);
  // RecordDuelResult persists a 1v1 duel outcome (issue #118, _MSG_ReqRanking):
  // winner_name's wins and loser_name's losses are each incremented by one in
  // character_pvp_stats. Both names must resolve to an existing character or
  // the whole call fails (no lopsided half-result).
  rpc RecordDuelResult(RecordDuelResultRequest) returns (RecordDuelResultResponse);

  // RecordTrade stores one completed player-to-player trade (0025_trade_log),
  // so a moderator answering "he scammed me" has something besides the two
  // players' word.
  //
  // Best-effort on purpose: the trade already happened in the world and cannot
  // be undone because Postgres was slow, so the tmServer logs a failure rather
  // than retrying. The row is evidence, not state.
  rpc RecordTrade(RecordTradeRequest) returns (RecordTradeResponse);

  // RecordReport stores one /reportar (0028_player_report): what the player
  // wrote, plus the position, the level and the character names in view at that
  // instant.
  //
  // Best-effort like RecordTrade, and for a sharper reason: the player has
  // already been told their report went in. A slow Postgres must not turn that
  // into an error on their screen, so the tmServer logs the failure and moves on.
  rpc RecordReport(RecordReportRequest) returns (RecordReportResponse);

  // RecordGround stores one drop or pickup (0031_ground_log).
  //
  // The floor was the one route an item could take between two players leaving
  // no record at all: getItem hands a floor item to anyone within three tiles
  // with no owner check, which is exactly why a determined scammer uses it.
  //
  // Best-effort like the others: the item already moved in the world, and
  // failing to write about it must not undo that.
  rpc RecordGround(RecordGroundRequest) returns (RecordGroundResponse);

  // ReserveSerials hands the tmServer a block of item serials
  // (0033_item_serial).
  //
  // A block rather than one number at a time because the caller is the game
  // loop: it owns all world state alone and never blocks, so it cannot ask for
  // a number while stamping an item. It takes a few thousand at boot and asks
  // for more before running out.
  rpc ReserveSerials(ReserveSerialsRequest) returns (ReserveSerialsResponse);

  // RecordChat stores a BATCH of chat lines (0034_chat_log).
  //
  // A batch, not one call per line, because chat is the highest-volume thing a
  // game server produces: the tmServer buffers a few seconds' worth and sends
  // them together, so the database is not in the path of every sentence anybody
  // types.
  //
  // Best-effort from the caller's side — the words were already said and heard.
  rpc RecordChat(RecordChatRequest) returns (RecordChatResponse);

  // SetCharacterPresence marks a character as in-play (login) or out (logout or
  // disconnect), so the staff panel can tell whether the database is the
  // authority for that character's items.
  //
  // It answers a question ListOnline cannot. Kick returns as soon as the session
  // closes, but the character's save leaves after that; this mark is cleared
  // only once that save has committed, so its absence means "the last write
  // landed", not merely "the socket is gone".
  rpc SetCharacterPresence(SetCharacterPresenceRequest) returns (SetCharacterPresenceResponse);
  // ClearAllPresence drops every mark. Called once at boot: a server that just
  // started has nobody in-play, and this is what keeps a crash from stranding
  // characters marked online forever.
  rpc ClearAllPresence(ClearAllPresenceRequest) returns (ClearAllPresenceResponse);

  // Guild lifecycle and war/city state (issue #114). These RPCs are modern
  // tmServer↔dbServer calls replacing the legacy DBSrv CPSock relays for
  // GuildInfo, GuildAlly, War, Guilds.txt, Chall_*, and Guild_* files.
  rpc CreateGuild(CreateGuildRequest) returns (CreateGuildResponse);
  rpc SetGuildMember(SetGuildMemberRequest) returns (SetGuildMemberResponse);
  rpc LeaveGuild(LeaveGuildRequest) returns (SetGuildMemberResponse);
  rpc PromoteGuildMember(PromoteGuildMemberRequest) returns (PromoteGuildMemberResponse);
  rpc TransferGuildLeader(TransferGuildLeaderRequest) returns (SetGuildMemberResponse);
  rpc SetGuildRelation(SetGuildRelationRequest) returns (SetGuildRelationResponse);
  rpc ListGuilds(ListGuildsRequest) returns (ListGuildsResponse);
  rpc ListGuildRelations(ListGuildRelationsRequest) returns (ListGuildRelationsResponse);
  rpc LoadGuildZones(LoadGuildZonesRequest) returns (LoadGuildZonesResponse);
  rpc SaveGuildZone(SaveGuildZoneRequest) returns (SaveGuildZoneResponse);
  rpc LoadGuildTowerState(LoadGuildTowerStateRequest) returns (LoadGuildTowerStateResponse);
  rpc SaveGuildTowerState(SaveGuildTowerStateRequest) returns (SaveGuildTowerStateResponse);
  // SaveGuildFame writes a guild's fame (an absolute value, not a delta), so
  // fame earned in game survives a restart. ok=false: no guild has that id.
  rpc SaveGuildFame(SaveGuildFameRequest) returns (SaveGuildFameResponse);
  rpc LoadCastleQuestState(LoadCastleQuestStateRequest) returns (LoadCastleQuestStateResponse);
  rpc SaveCastleQuestState(SaveCastleQuestStateRequest) returns (SaveCastleQuestStateResponse);
}

enum LoginResult {
  LOGIN_RESULT_UNSPECIFIED = 0;
  LOGIN_RESULT_OK = 1;
  LOGIN_RESULT_NO_ACCOUNT = 2;   // _MSG_DBAccountLoginFail_Account
  LOGIN_RESULT_BAD_PASSWORD = 3; // _MSG_DBAccountLoginFail_Pass
  LOGIN_RESULT_BLOCKED = 4;      // _MSG_DBAccountLoginFail_Block
  LOGIN_RESULT_ALREADY_PLAYING = 5;
}

message AccountLoginRequest {
  string account_name = 1; // canonical lowercase
  string password = 2;     // verified against the stored argon2id hash
  int32 client_version = 3;
}

message AccountLoginResponse {
  LoginResult result = 1;
  int64 account_id = 2;
  // role is account.role ('player'/'moderator'/'admin'). It is carried to the
  // tmServer so the game loop can gate in-game GM/moderation commands (issue
  // #122) — the explicit server-side authority that replaces the legacy fragile
  // "character Level >= 1000" backdoor.
  string role = 3;
}

message ListCharactersRequest { int64 account_id = 1; }

message CharacterSummary {
  int32 slot = 1;
  string name = 2;
  int32 class = 3;
  int32 level = 4;
  int64 exp = 5;
  uint32 guild_id = 6;
  // Score preview shown on the character-selection screen (STRUCT_SELCHAR).
  int32 coin = 7;
  int32 max_hp = 8;
  int32 hp = 9;
  int32 max_mp = 10;
  int32 mp = 11;
  int32 str = 12;
  int32 int = 13;
  int32 dex = 14;
  int32 con = 15;
  // Equipped items shown on the character-selection model. Empty slots are
  // omitted; tmServer falls back to the class BaseMob only when none are present.
  repeated Item equip = 16;
}

message ListCharactersResponse { repeated CharacterSummary characters = 1; }

message LoadCharacterRequest {
  int64 account_id = 1;
  int32 slot = 2;
}

// Character carries the relational character state (domain.Character). Equip,
// carry and affects are normalized lists; empty item slots are omitted.
message Character {
  int32 slot = 1;
  string name = 2;
  int32 class = 3;
  int32 clan = 4;
  uint32 guild_id = 5;
  int32 level = 6;
  int64 exp = 7;
  int32 coin = 8;
  int32 str = 9;
  int32 int = 10;
  int32 dex = 11;
  int32 con = 12;
  int32 max_hp = 13;
  int32 max_mp = 14;
  int32 hp = 15;
  int32 mp = 16;
  repeated Item equip = 17;
  repeated Item carry = 18;
  repeated Affect affects = 19;
  int32 last_city = 20; // last city visited (0..3); spawn = that city's default area

  // Skill/bonus state (skills front). skill_bonus is NOT carried: the tmServer
  // re-derives it at login from level and the learned mask, exactly as the
  // legacy BASE_GetBonusSkillPoint does on character load.
  int32 score_bonus = 21;          // free attribute points
  int32 special_bonus = 22;        // free mastery points (incremental, +2/level)
  int32 learned_skill = 23;        // MOB.LearnedSkill bitmask
  int64 magic = 24;                // CurrentScore.Magic
  repeated int32 special = 25;     // BaseScore.Special[4] (allocated mastery)
  repeated uint32 skill_bar = 26;  // MOB.SkillBar[4]
  repeated uint32 short_skill = 27; // CUser.ShortSkill[16] (client hotbar)
  int32 sec_learned_skill = 28;    // MobExtra.SecLearnedSkill
  int32 soul = 29;                 // MobExtra.Soul
  int32 class_master = 30;         // MobExtra.ClassMaster (MORTAL=2, ARCH=1)
  int32 citizen = 31;              // MobExtra.Citizen (city allegiance; 0 = none)
  int32 fame = 32;                 // MobExtra.Fame
  int32 save_x = 33;               // STRUCT_MOB.SPX: Gema Estelar warp save-point
  int32 save_y = 34;               // STRUCT_MOB.SPY: Gema Estelar warp save-point
  int32 celestial_lv40 = 35;       // QuestInfo.Celestial.Lv40 (celestial level-40 gate)
  int32 celestial_lv90 = 36;       // QuestInfo.Celestial.Lv90 (celestial level-90 gate)
  int32 celestial_circle = 37;     // QuestInfo.Circle (Cythera Arcana quest done)
  int32 guild_level = 38;          // MOB.GuildLevel: 0 member, 6..8 sub, 9 leader
  int32 mortal_terra_mistica = 39; // QuestInfo.Mortal.TerraMistica (AMU_MISTICO, issue #139)

  // PK/karma state (GetFunc.cpp KILL_MARK carry slot, issue #210).
  int32 pk_point = 40;  // chaos/karma counter, 75 = neutral
  int32 guilty = 41;    // PvP "red nick" decay counter
  int32 cur_kill = 42;  // current PvP kill streak
  uint32 tot_kill = 43; // lifetime PvP kills
  int32 arch_lv355 = 44; // QuestInfo.Arch.Level355
  int32 arch_lv370 = 45; // QuestInfo.Arch.Level370
  int32 mortal_level = 46; // QuestInfo.Arch.MortalLevel
  int32 celestial_arch_level = 47; // QuestInfo.Celestial.ArchLevel band (1..5)
  // QuestInfo.Arch.Cristal: how many of the four Arch crystal quests are done
  // (0..4). It must persist, and not only to stop the quest being repeated: the
  // AC those quests grant is rebuilt from this counter on every login, because
  // BaseScore.Ac itself is derived rather than stored (handler.playerBaseAC).
  int32 arch_cristal = 48;
  // MobExtra.NT: Pesadelo Arcano entries held. Escritura do Pesadelo grants 13
  // and each admission to the A tier spends one (pesadelo-plan.md).
  int32 nightmare_tickets = 49;
}

message Item {
  int32 slot = 1;
  int32 index = 2;
  int32 eff1 = 3;
  int32 effv1 = 4;
  int32 eff2 = 5;
  int32 effv2 = 6;
  int32 eff3 = 7;
  int32 effv3 = 8;
  // Unix-seconds expiry for timed items (0 = permanent). Set on grant (e.g. the
  // 30-day Perzen mount); the world drops the item once it passes.
  int64 expires_at = 9;
  // The item's identity (0033_item_serial), 0 = unmarked. Like expires_at it
  // exists only on this side of the wire: the game's own STRUCT_ITEM has room
  // for an index and three effect pairs and nothing more, so this is the only
  // place an identity can live without costing the item an effect.
  int64 serial = 10;
}

message Affect {
  int32 type = 1;
  int32 value = 2;
  int32 level = 3;
  uint32 time = 4;
}

message LoadCharacterResponse { Character character = 1; }

message SaveCharacterRequest {
  int64 account_id = 1;
  Character character = 2;
}
message SaveCharacterResponse { bool ok = 1; }

message QuoteKingdomCapeRequest {}
message QuoteKingdomCapeResponse {
  int64 revision = 1;
  int32 hekalotia_cost = 2;
  int32 akelonia_cost = 3;
}

message PurchaseKingdomCapeRequest {
  int64 account_id = 1;
  int64 expected_revision = 2;
  int32 kingdom = 3;
  Character character = 4;
}
message PurchaseKingdomCapeResponse {
  bool ok = 1;
  QuoteKingdomCapeResponse quote = 2;
}

message CreateCharacterRequest {
  int64 account_id = 1;
  int32 slot = 2;
  string name = 3;
  int32 class = 4;
}
message CreateCharacterResponse {
  bool ok = 1;
  int64 character_id = 2;
}

message CreateArchCharacterRequest {
  int64 account_id = 1;
  string name = 2;
  int32 class = 3;
  int32 mortal_face = 4;
  int32 mortal_slot = 5;
  int32 mortal_level = 6;
}
message CreateArchCharacterResponse {
  bool ok = 1;
  int64 character_id = 2;
  int32 slot = 3;
}

message DeleteCharacterRequest {
  int64 account_id = 1;
  int32 slot = 2;
  string password = 3;
}
message DeleteCharacterResponse { bool ok = 1; }

// PinResult mirrors LoginResult for the numeric-PIN (AccountSecure) check.
enum PinResult {
  PIN_RESULT_UNSPECIFIED = 0;
  PIN_RESULT_OK = 1;         // PIN matches the stored hash
  PIN_RESULT_NO_ACCOUNT = 2; // no such account
  PIN_RESULT_NOT_SET = 3;    // account has no PIN yet (first-time set)
  PIN_RESULT_BAD_PIN = 4;    // PIN does not match
}

message SetPinRequest {
  int64 account_id = 1;
  string pin = 2; // hashed with argon2id server-side; never stored in plaintext
}
message SetPinResponse { bool ok = 1; }

message VerifyPinRequest {
  int64 account_id = 1;
  string pin = 2;
}
message VerifyPinResponse { PinResult result = 1; }

// Cargo is the account-shared warehouse (domain.Account.CargoCoin + Cargo). It is
// keyed by account_id (NOT character) because all of an account's characters
// deposit into and withdraw from the same vault. Empty item slots are omitted.
message LoadCargoRequest { int64 account_id = 1; }
message LoadCargoResponse {
  int32 cargo_coin = 1;
  repeated Item items = 2;
}
message SaveCargoRequest {
  int64 account_id = 1;
  int32 cargo_coin = 2;
  repeated Item items = 3;
}
message SaveCargoResponse { bool ok = 1; }

// Delivery is one pending grant from the delivery_queue mailbox (issue #34). For
// an item grant, item.slot is unused — the drain assigns the next free cargo slot
// (or loses the item when the cargo is full).
message Delivery {
  int64 id = 1;
  Item item = 2;
}
message ListPendingDeliveriesRequest { int64 account_id = 1; }
message ListPendingDeliveriesResponse { repeated Delivery deliveries = 1; }

message SaveCargoWithDeliveriesRequest {
  int64 account_id = 1;
  int32 cargo_coin = 2;
  repeated Item items = 3;
  repeated int64 delivered_ids = 4; // rows applied to the cargo
  repeated int64 lost_ids = 5;      // rows dropped (cargo was full)
}

message SetAccountBlockedRequest {
  string account_name = 1; // canonical lowercase
  bool blocked = 2;        // true = ban, false = unban
}
// ok is false when no account matched the name (nothing changed).
message SetAccountBlockedResponse { bool ok = 1; }

message RecordDuelResultRequest {
  string winner_name = 1;
  string loser_name = 2;
}
// ok is false when either character name didn't resolve (nothing recorded).
message RecordDuelResultResponse { bool ok = 1; }

// TradeItem is one item as it changed hands: the catalog index and the three
// effect pairs the instance carried.
message TradeItem {
  int32 index = 1;
  int32 eff1 = 2;
  int32 effv1 = 3;
  int32 eff2 = 4;
  int32 effv2 = 5;
  int32 eff3 = 6;
  int32 effv3 = 7;
}

// RecordTradeRequest describes a finished trade. Sides A and B are whichever two
// players were in the window; there is no giver and receiver, because both
// directions happen at once. gold_a is what A handed to B.
message RecordTradeRequest {
  string char_a = 1;
  string char_b = 2;
  int64 account_a = 3;  // 0 when unknown
  int64 account_b = 4;
  int32 gold_a = 5;
  int32 gold_b = 6;
  repeated TradeItem items_a = 7;
  repeated TradeItem items_b = 8;
}
// ok is true when the row was written. A failure comes back as an error status,
// which the tmServer logs; the trade itself already happened either way.
message RecordTradeResponse { bool ok = 1; }

// ReserveSerialsRequest asks for `count` consecutive item serials.
message ReserveSerialsRequest { int64 count = 1; }

// ReserveSerialsResponse is the first serial of the reserved block; the caller
// owns [first, first+count).
message ReserveSerialsResponse { int64 first = 1; }

// ChatLine is one thing somebody said.
message ChatLine {
  // Unix seconds. Set by the tmServer when the line was spoken, not when the
  // batch was sent: a buffered batch would otherwise stamp everything with the
  // flush time and lose the order inside a conversation.
  int64 at = 1;
  // "publico" or "sussurro".
  string tipo = 2;
  int64 account_id = 3;
  string character = 4;
  // Who the whisper was for; empty on public speech.
  string alvo = 5;
  string texto = 6;
  int32 pos_x = 7;
  int32 pos_y = 8;
}

message RecordChatRequest { repeated ChatLine lines = 1; }
message RecordChatResponse { bool ok = 1; }

// RecordReportRequest is one player report and the snapshot around it.
message RecordGroundRequest {
  // "largou" or "pegou". An item changing hands through the floor writes both.
  string acao = 1;
  int64 account_id = 2;  // 0 when unknown
  string character = 3;
  int32 item_index = 4;
  int32 eff1 = 5;
  int32 effv1 = 6;
  int32 eff2 = 7;
  int32 effv2 = 8;
  int32 eff3 = 9;
  int32 effv3 = 10;
  int32 pos_x = 11;
  int32 pos_y = 12;
  // ground_id is the item's slot in the server's floor array. Reused over time,
  // so it identifies nothing forever — but it pairs a drop with the pickup that
  // followed, which is the question anybody reading this asks.
  int32 ground_id = 13;
}
message RecordGroundResponse { bool ok = 1; }

message RecordReportRequest {
  int64 account_id = 1;  // 0 when unknown
  string account = 2;
  string character = 3;
  int32 level = 4;
  // text is what the player typed. The store clamps it; a crafted packet must
  // not write a megabyte per report.
  string text = 5;
  int32 pos_x = 6;
  int32 pos_y = 7;
  // nearby is the character names in view at that instant, and nothing else —
  // no positions, no accounts. It is what makes "somebody here is botting"
  // checkable, and it is also names of people who did not ask to be in anyone
  // record, which is why the row expires.
  repeated string nearby = 8;
}
message RecordReportResponse { bool ok = 1; }

message SetCharacterPresenceRequest {
  string character_name = 1;
  bool online = 2;
}
// ok is false when the name did not resolve (nothing marked).
message SetCharacterPresenceResponse { bool ok = 1; }

message ClearAllPresenceRequest {}
// cleared is how many characters were still marked — non-zero after an unclean
// shutdown, and worth logging at boot.
message ClearAllPresenceResponse { int64 cleared = 1; }

message Guild {
  uint32 id = 1;      // legacy ushort guild id
  string name = 2;
  int32 clan = 3;
  int32 fame = 4;
  int32 citizen = 5;
}

enum GuildRelationKind {
  GUILD_RELATION_KIND_NONE = 0;
  GUILD_RELATION_KIND_ALLY = 1;
  GUILD_RELATION_KIND_WAR = 2;
}

message GuildRelation {
  uint32 guild_id = 1;
  uint32 target_guild_id = 2;
  GuildRelationKind kind = 3;
}

message CreateGuildRequest {
  int64 account_id = 1;
  int32 slot = 2;
  string character_name = 3;
  string guild_name = 4;
  int32 clan = 5;
  int32 citizen = 6;
  int32 server_index = 7;
  int32 cost = 8;
}
message CreateGuildResponse {
  bool ok = 1;
  Guild guild = 2;
}

message SetGuildMemberRequest {
  int64 account_id = 1;
  int32 slot = 2;
  string character_name = 3;
  uint32 guild_id = 4;
  int32 guild_level = 5;
}
message SetGuildMemberResponse { bool ok = 1; }

message LeaveGuildRequest {
  int64 account_id = 1;
  int32 slot = 2;
}

message PromoteGuildMemberRequest {
  uint32 guild_id = 1;
  int64 leader_account_id = 2;
  int32 leader_slot = 3;
  int64 account_id = 4;
  int32 slot = 5;
  int32 cost = 6;
}
message PromoteGuildMemberResponse {
  bool ok = 1;
  int32 guild_level = 2;
}

message TransferGuildLeaderRequest {
  uint32 guild_id = 1;
  int64 old_account_id = 2;
  int32 old_slot = 3;
  int64 new_account_id = 4;
  int32 new_slot = 5;
}

message SetGuildRelationRequest {
  uint32 guild_id = 1;
  uint32 target_guild_id = 2;
  GuildRelationKind kind = 3;
}
message SetGuildRelationResponse { bool ok = 1; }

message ListGuildsRequest {}
message ListGuildsResponse { repeated Guild guilds = 1; }

message ListGuildRelationsRequest {}
message ListGuildRelationsResponse { repeated GuildRelation relations = 1; }

message GuildZone {
  int32 zone = 1;
  uint32 charge_guild = 2;
  uint32 challenge_guild = 3;
  int32 clan = 4;
  int32 victory = 5;
  int32 city_tax = 6;
  int64 challenge_money = 7;
  int64 tax_vault = 8;

  // Where a member of the OWNING guild respawns, wherever they died. Zero on
  // either axis means "not configured" and falls back to the city spawn.
  //
  // The legacy reads these two in both respawn paths and never writes them, so
  // they were always zero and its owning guild would have landed at the map
  // corner. Carried here because the value now comes from the database.
  int32 guild_spawn_x = 9;
  int32 guild_spawn_y = 10;
}

message LoadGuildZonesRequest {}
message LoadGuildZonesResponse { repeated GuildZone zones = 1; }

message SaveGuildZoneRequest { GuildZone zone = 1; }
message SaveGuildZoneResponse { bool ok = 1; }

message GuildTowerState {
  uint32 owner_guild = 1;
  int64 updated_at_unix = 2;
}
message LoadGuildTowerStateRequest {}
message LoadGuildTowerStateResponse { GuildTowerState state = 1; }
message SaveGuildTowerStateRequest { GuildTowerState state = 1; }
message SaveGuildTowerStateResponse { bool ok = 1; }

message SaveGuildFameRequest {
  uint32 guild_id = 1;
  int32 fame = 2;
}
message SaveGuildFameResponse { bool ok = 1; }

message CastleQuestState {
  int32 level = 1;
  int32 time_left = 2;
  bool clear = 3;
  string leader_name = 4;
}
message LoadCastleQuestStateRequest {}
message LoadCastleQuestStateResponse { CastleQuestState state = 1; }
message SaveCastleQuestStateRequest { CastleQuestState state = 1; }
message SaveCastleQuestStateResponse { bool ok = 1; }

// NpcConfigService serves the moderator-editable NPC configuration to tmServer
// (npc-editing-plan.md). It is READ-ONLY from tmServer's side: the web-api writes
// the definitions to Postgres; tmServer polls the version and reloads the full
// snapshot when it changes, then materializes the live entities inside its
// single-owner loop. Separate from AccountService, which mirrors legacy G↔DB.
service NpcConfigService {
  // NpcConfigVersion returns the monotonic config version (cheap poll).
  rpc NpcConfigVersion(NpcConfigVersionRequest) returns (NpcConfigVersionResponse);
  // ListNpcDefinitions returns the full definition snapshot + global price overrides.
  rpc ListNpcDefinitions(ListNpcDefinitionsRequest) returns (ListNpcDefinitionsResponse);
  // ListMobTemplateStats returns every moderator-edited mob/NPC template stat
  // override (mob-template-editing-plan.md, the equivalent-tool successor to
  // the legacy EDITAPPMOB). Deliberately independent of NpcDefinition/
  // ListNpcDefinitions: a stat override applies to ANY npc/<template_name>
  // file (monsters included), not just the DB-managed merchant subset, and
  // is applied by tmServer only once at boot — no version field, because
  // there is no hot-reload for this feature (EDITAPPMOB itself required a
  // server restart too).
  rpc ListMobTemplateStats(ListMobTemplateStatsRequest) returns (ListMobTemplateStatsResponse);
  // ListItemStats returns every moderator-edited item base stat override
  // (0023_item_stats), the item-side sibling of ListMobTemplateStats. Applied
  // by tmServer once at boot for the same reason: these numbers feed the equip
  // score model, which is recomputed per character, so a live swap would leave
  // two players wearing the same item with different stats. Unlike the price
  // overrides in ListNpcDefinitions, which are read at the moment of a shop
  // transaction and hot-reload safely.
  rpc ListItemStats(ListItemStatsRequest) returns (ListItemStatsResponse);

  // ListMountGrowthRates returns the configured mount growth curves
  // (0030_mount_growth_rate): the chance an amago raises an ADULT mount one
  // level, per lineage and per band of twenty levels. Read once at boot like
  // the other content overlays — swapping a curve under a running server would
  // leave two players feeding the same mount at different odds on the same
  // afternoon, and that reads as luck rather than as a change.
  //
  // There is no legacy curve to match: BASE_GetGrowthRate is absent from the
  // sources, so the shape is this server's balance decision.
  rpc ListMountGrowthRates(ListMountGrowthRatesRequest) returns (ListMountGrowthRatesResponse);

  // ListMountAbsorb returns how much of a hit each adult mount eats instead of
  // its owner (0035_mount_absorb), one number against players and one against
  // monsters. Read once at boot, like every other content overlay here.
  //
  // The legacy absorbs a flat 25% either way (_MSG_Attack.cpp:1520-1533). The
  // two numbers are this server's addition: they are what lets a lineage be a
  // PvE mount or a PvP mount rather than one of thirty identical shields. A
  // lineage with no row keeps 25/25 and plays exactly as the original did.
  rpc ListMountAbsorb(ListMountAbsorbRequest) returns (ListMountAbsorbResponse);

  // ListMountBonus returns the attack, magic, evasion and immunity the panel set
  // for each adult lineage (0043_mount_bonus). A lineage absent from the reply
  // keeps the compiled table (internal/mountbonus), which is the client's own.
  rpc ListMountBonus(ListMountBonusRequest) returns (ListMountBonusResponse);

  // MountConfigVersion is when the mount overlay last changed, as unix seconds.
  // tmServer reads it beside the tables at boot and reports it back through the
  // control channel, so the panel can tell "saved and live" from "saved, waiting
  // for a restart" — two states that look identical on the screen otherwise.
  rpc MountConfigVersion(MountConfigVersionRequest) returns (MountConfigVersionResponse);
}

message NpcConfigVersionRequest {}
message NpcConfigVersionResponse { int64 version = 1; }

message ListNpcDefinitionsRequest {}
message ListNpcDefinitionsResponse {
  int64 version = 1;
  repeated NpcDefinition definitions = 2;
  repeated ItemPrice price_overrides = 3;
}

// NpcShopItem is one merchant shop slot (overlays the template Carry[]). Effects
// are the 3 STRUCT_ITEM effect pairs. Price is NOT here — it is global (ItemPrice).
message NpcShopItem {
  int32 slot = 1;
  int32 item_index = 2;
  int32 eff1 = 3;  int32 effv1 = 4;
  int32 eff2 = 5;  int32 effv2 = 6;
  int32 eff3 = 7;  int32 effv3 = 8;
  // quantity is the stack amount sold by this slot. The tmServer converts
  // values >1 into EF_AMOUNT on the live STRUCT_ITEM.
  int32 quantity = 9;
}

message NpcDefinition {
  int64 id = 1;
  string slug = 2;
  string template_name = 3;
  string display_name = 4;
  bool enabled = 5;
  int32 map_id = 6;
  int32 pos_x = 7;
  int32 pos_y = 8;
  int32 route_type = 9;
  int32 merchant = 10;
  repeated NpcShopItem shop = 11;
  string origin = 12;
  int32 generator_index = 13;
  string follower_template = 14;
  int32 minute_generate = 15;
  int32 min_group = 16;
  int32 max_group = 17;
  int32 max_num_mob = 18;
  int32 formation = 19;
  repeated int32 seg_x = 20;
  repeated int32 seg_y = 21;
  repeated int32 seg_range = 22;
  repeated int32 seg_wait = 23;
  repeated string fight_action = 24;
  repeated string die_action = 25;
}

message ItemPrice {
  int32 item_index = 1;
  int64 price = 2;
}

// WorldEventConfigService serves portal-managed global world events to tmServer
// (issue #116). tmServer reads the config and writes only the event-progress
// counter; all moderator edits go through the web-api.
service WorldEventConfigService {
  // WorldEventConfigVersion returns the monotonic moderator config version.
  rpc WorldEventConfigVersion(WorldEventConfigVersionRequest) returns (WorldEventConfigVersionResponse);
  // GetWorldEventConfig returns the full global event snapshot.
  rpc GetWorldEventConfig(GetWorldEventConfigRequest) returns (GetWorldEventConfigResponse);
  // UpdateWorldEventProgress persists tmServer's current_index without bumping
  // the config version. expected_version rejects stale tmServer snapshots.
  rpc UpdateWorldEventProgress(UpdateWorldEventProgressRequest) returns (UpdateWorldEventProgressResponse);
}

message WorldEventConfigVersionRequest {}
message WorldEventConfigVersionResponse { int64 version = 1; }

message GetWorldEventConfigRequest {}
message GetWorldEventConfigResponse {
  int64 version = 1;
  WorldEventConfig config = 2;
}

message UpdateWorldEventProgressRequest {
  int64 expected_version = 1;
  int32 current_index = 2;
}
message UpdateWorldEventProgressResponse {
  bool applied = 1;
}

message WorldEventConfig {
  bool enabled = 1;
  int32 item_index = 2;
  int32 rate = 3;
  int32 start_index = 4;
  int32 current_index = 5;
  int32 end_index = 6;
  bool indexed = 7;
  bool notice_enabled = 8;
  bool double_exp_enabled = 9;
  bool newbie_event_enabled = 10;
  // When FALSE every PvE reward is halved (expreward.go step 11). Legacy
  // KefraLive=0, which is what this server has always run.
  bool kefra_live_enabled = 11;
  // The daily Tower War (migration 0051): on/off and the hour (0..23, server
  // time) it starts. `optional` so presence is visible: a dbServer older than
  // these fields sends neither, and tmServer must then run the decided default
  // (on, 20h) instead of reading the zero values as "off, at midnight".
  optional bool tower_war_enabled = 12;
  optional int32 tower_war_hour = 13;
}

message ListMobTemplateStatsRequest {}
message ListMobTemplateStatsResponse {
  repeated MobTemplateStat overrides = 1;
}

// MobTemplateEquipItem is one Equip[] slot override (0..15, MAX_EQUIP) for a
// mob template. Same shape as NpcShopItem minus quantity (equip slots don't
// stack).
message MobTemplateEquipItem {
  int32 slot = 1;
  int32 item_index = 2;
  int32 eff1 = 3;  int32 effv1 = 4;
  int32 eff2 = 5;  int32 effv2 = 6;
  int32 eff3 = 7;  int32 effv3 = 8;
}

// MobTemplateStat is a moderator-edited stat override for a raw STRUCT_MOB
// mob/NPC template file (mob-template-editing-plan.md) — the field surface
// the legacy EDITAPPMOB tool edited, minus Carry[] (already NpcShopItem) and
// DB-managed spawn position (already NpcDefinition). BaseScore/CurrentScore
// are not modeled separately: tmServer mirrors the same value into both,
// matching EDITAPPMOB's own `CurrentScore = BaseScore` on save.
message MobTemplateStat {
  string template_name = 1;
  string display_name = 2;  // "" keeps the template file's own name
  int32 clan = 3;
  int32 merchant = 4;  // STRUCT_MOB top-level Merchant — distinct from NpcDefinition.merchant
  int32 class = 5;
  int32 coin = 6;
  int64 exp = 7;
  int32 spx = 8;
  int32 spy = 9;
  int32 level = 10;
  int32 ac = 11;
  int32 damage = 12;
  int32 chaos_rate = 13;
  int32 attack_run = 14;
  int32 direction = 15;
  int32 str = 16;
  int32 intel = 17;  // "int" avoided (reserved in several target languages)
  int32 dex = 18;
  int32 con = 19;
  int32 special1 = 20;
  int32 special2 = 21;
  int32 special3 = 22;
  int32 special4 = 23;
  int32 max_hp = 24;
  int32 hp = 25;
  int32 max_mp = 26;
  int32 mp = 27;
  int32 learned_skill = 28;
  int32 score_bonus = 29;
  int32 skill_bar1 = 30;
  int32 skill_bar2 = 31;
  int32 skill_bar3 = 32;
  int32 skill_bar4 = 33;
  int32 regen_hp = 34;
  int32 regen_mp = 35;
  int32 resist1 = 36;
  int32 resist2 = 37;
  int32 resist3 = 38;
  int32 resist4 = 39;
  repeated MobTemplateEquipItem equip = 40;
}

message ListItemStatsRequest {}
message ListItemStatsResponse {
  repeated ItemStat overrides = 1;
}

// ItemStat replaces one catalog item's static numbers: what it requires to
// equip, and the base effects it grants while equipped. It is the whole effect
// list, not a patch over it — merging would need a value meaning "not
// overridden", and 0 is a legitimate setting for every field here.
//
// Values are int32 on the wire but int16 in the game: STRUCT_EFFECT carries an
// int16, and the loader narrows regardless. proto3 has no 16-bit scalar, so the
// narrowing lives in the client rather than the contract.
message ItemStat {
  int32 item_index = 1;
  int32 req_level = 2;  // requirement to equip: ItemList.csv "Lvl.Str.Int.Dex.Con"
  int32 req_str = 3;
  int32 req_int = 4;
  int32 req_dex = 5;
  int32 req_con = 6;
  int32 damage = 7;  // combat
  int32 damageadd = 8;
  int32 ac = 9;
  int32 acadd = 10;
  int32 magic = 11;
  int32 magicadd = 12;
  int32 critical = 13;
  int32 critical2 = 14;
  int32 runspeed = 15;
  int32 str = 16;  // attributes
  int32 intel = 17;  // "int" is reserved in several targets
  int32 dex = 18;
  int32 con = 19;
  int32 hp = 20;  // life
  int32 hpadd = 21;
  int32 hpadd2 = 22;
  int32 mp = 23;
  int32 mpadd = 24;
  int32 mpadd2 = 25;
  int32 resist1 = 26;  // resistances
  int32 resist2 = 27;
  int32 resist3 = 28;
  int32 resist4 = 29;
  int32 resistall = 30;
  int32 special1 = 31;  // masteries
  int32 special2 = 32;
  int32 special3 = 33;
  int32 special4 = 34;
  int32 specialall = 35;
  int32 itemlevel = 36;  // identity and mechanics — carried, not balanced
  int32 itemtype = 37;
  int32 mobtype = 38;
  int32 wtype = 39;
  int32 pos = 40;
  int32 sanc = 41;
  int32 nosanc = 42;
  int32 incubate = 43;
  int32 incudelay = 44;
  // The two effects the score model deliberately does not carry, applied to
  // their own maps at boot instead of to the item's effect list.
  //
  // ef_range is attack reach, and it reaches MONSTERS: the map it feeds is read
  // when a mob spawns, as the largest EF_RANGE over its template's equips.
  // ef_volatile is what the item does when used — potion, divine, scroll — so it
  // is the item's class rather than a stat.
  int32 ef_range = 45;
  int32 ef_volatile = 46;
}

message ListMountGrowthRatesRequest {}
message ListMountGrowthRatesResponse {
  repeated MountGrowthRate rates = 1;
}

// MountGrowthRate is one point of one mount's curve. Bands are twenty levels
// wide: 0 covers 1..20, 5 covers 101..120.
//
// A lineage with NO rows keeps the compiled default — absence means "not
// configured", never "zero chance", so a server that has never opened the
// screen behaves exactly as it did before.
message MountGrowthRate {
  int32 mount_index = 1;  // the ADULT mount, 2360..2389
  int32 band = 2;         // 0..5
  int32 rate = 3;         // 0..100
}

message MountConfigVersionRequest {}
message MountConfigVersionResponse { int64 version = 1; }

message ListMountAbsorbRequest {}
message ListMountAbsorbResponse {
  repeated MountAbsorb absorb = 1;
}

// MountAbsorb is one lineage's pair. Both numbers travel together because they
// are the two halves of a single decision about what the mount is for.
//
// A lineage with NO row keeps the compiled default (25/25, the legacy) —
// absence means "not configured", never "absorbs nothing".
message MountAbsorb {
  int32 mount_index = 1;  // the ADULT mount, 2360..2389
  int32 absorb_pvp = 2;   // 0..100, against a player's blow
  int32 absorb_pve = 3;   // 0..100, against a monster's
}

message ListMountBonusRequest {}
message ListMountBonusResponse {
  repeated MountBonus bonus = 1;
}

// MountBonus is one lineage's configured attributes. The four travel together
// for the same reason the absorption pair does: they are one decision about
// what the mount is.
message MountBonus {
  int32 mount_index = 1; // the ADULT mount, 2360..2389
  int32 attack = 2;      // coefficient, 0..2000: (level+20)*attack/100
  int32 magic = 3;       // coefficient, 0..500: (level+15)*magic/100
  int32 evasion = 4;     // tenths of a percent, 0..100
  int32 resist = 5;      // 0..100, all four resistances
}

// XPConfigService serves the Mesa de XP — the panel-managed experience tables —
// to tmServer. The legacy picks a reward branch by the 128-tile block a kill
// happens on, one branch per instanced dungeon plus the general field, and this
// carries the moderator's edits to those branches. tmServer only reads.
service XPConfigService {
  // XPConfigVersion returns the monotonic moderator config version.
  rpc XPConfigVersion(XPConfigVersionRequest) returns (XPConfigVersionResponse);
  // GetXPConfig returns every edited branch. Branches absent from the reply run
  // on the legacy tables, which is the default state of a fresh server.
  rpc GetXPConfig(GetXPConfigRequest) returns (GetXPConfigResponse);
}

message XPConfigVersionRequest {}
message XPConfigVersionResponse { int64 version = 1; }

message GetXPConfigRequest {}
message GetXPConfigResponse {
  int64 version = 1;
  repeated XPRule rules = 2;
}

// XPCut is one rung of a table: up to this level, divide by this much. The last
// rung of a table has no ceiling and carries the maximum int32 as up_to.
message XPCut {
  int32 up_to = 1;
  double divisor = 2;
}

// XPRule is one reward branch's configuration.
//
// has_cuts is what keeps "not edited" apart from "edited to have no cuts": proto3
// cannot tell an absent repeated field from an empty one, and the two mean
// opposite things here. false ⇒ keep the legacy table; true with an empty cuts
// list ⇒ this branch divides by nothing, which is how Pesadelo Normal already
// treats Mortal and Arch.
message XPRule {
  int32 zone = 1;          // internal/level.Zone
  int32 tier = 2;          // ClassMaster: 1 Arch, 2 Mortal, 3 Celestial
  int32 rate_percent = 3;  // applied last, after every legacy step; 100 is neutral
  bool has_cuts = 4;
  repeated XPCut cuts = 5;
}

// DungeonGateService serves the instanced dungeons' doors to tmServer.
//
// Unlike XPConfigService this is POLLED: a door is an operational switch, not a
// balance number, and "close the Místico now" that only takes effect after a
// restart is useless. Same version-then-snapshot shape as
// WorldEventConfigService, which tmServer already polls.
service DungeonGateService {
  // DungeonGateVersion returns the monotonic version. Asked every few seconds.
  rpc DungeonGateVersion(DungeonGateVersionRequest) returns (DungeonGateVersionResponse);
  // GetDungeonGates returns every touched door. Doors absent from the reply are
  // open and announced, which is how the server behaved before the table existed.
  rpc GetDungeonGates(GetDungeonGatesRequest) returns (GetDungeonGatesResponse);
}

message DungeonGateVersionRequest {}
message DungeonGateVersionResponse { int64 version = 1; }

message GetDungeonGatesRequest {}
message GetDungeonGatesResponse {
  int64 version = 1;
  repeated DungeonGate gates = 2;
}

// DungeonGate is one door. `gate` is the internal/dungeon.Gate index, appended
// to and never reordered.
message DungeonGate {
  int32 gate = 1;
  bool open = 2;
  bool announce = 3;
}

// QuestRewardService serves the panel-managed quest-trophy payouts to tmServer.
//
// Read at BOOT, like XPConfigService and for the same reason: it is a balance
// number, not an operational switch. Two players using the same trophy minutes
// apart must not get different amounts.
service QuestRewardService {
  // GetQuestRewards returns every edited tier. Tiers absent from the reply keep
  // whatever Common/Settings/QuestsRate.txt says.
  rpc GetQuestRewards(GetQuestRewardsRequest) returns (GetQuestRewardsResponse);
}

message GetQuestRewardsRequest {}
message GetQuestRewardsResponse {
  int64 version = 1;
  repeated QuestReward tiers = 2;
}

// QuestReward is one trophy's payout. `tier` is the item offset from 4117, so
// 0 is the Cemitério and 4 the Elfos. The level band is half-open: min
// inclusive, max exclusive, as the legacy gate reads it.
message QuestReward {
  int32 tier = 1;
  int64 mortal_exp = 2;
  int64 arch_exp = 3;
  int32 coin = 4;
  int32 mortal_min = 5;
  int32 mortal_max = 6;
  int32 arch_min = 7;
  int32 arch_max = 8;
}

// DropBonusService serves the panel-managed drop-bonus ladders to tmServer.
//
// Read at BOOT, like QuestRewardService and for the same reason: it is a balance
// number, not an operational switch. Two players killing the same mob minutes
// apart must not get items from different generations, with nothing on screen to
// explain the difference.
service DropBonusService {
  // GetDropBonus returns every edited band plus whether the roll runs at all.
  // Bands absent from the reply keep the legacy ladder.
  rpc GetDropBonus(GetDropBonusRequest) returns (GetDropBonusResponse);
}

message GetDropBonusRequest {}
message GetDropBonusResponse {
  int64 version = 1;
  // Whether the drop-time bonus roll runs. It defaults TRUE, and exists so a
  // server can switch the roll off in one click instead of a redeploy — it was
  // missing for the whole life of the rewrite, so landing it is a real change.
  bool ligado = 2;
  repeated DropBonusBand faixas = 3;
}

// DropBonusBand is one level-distance band's two ladders. `distancia` is 0 when
// the mob is at the item's own level and 3 when it is 74+ levels above.
//
// Both ladders read the same way: a 0..99 draw is compared against the limits in
// order, and the first limit it falls under picks the outcome. A limit of 100
// makes everything after it unreachable, which is how the legacy says "this band
// never rolls nothing".
message DropBonusBand {
  int32 distancia = 1;
  // Four magnitude thresholds, ascending, and the five steps they separate.
  repeated int32 limite = 2;
  repeated int32 degrau = 3;
  // Four refine thresholds, ascending: +2, +1, +0, special bonus.
  repeated int32 refino = 4;
}

// SpawnRateService serves the per-area monster respawn pacing to tmServer.
//
// POLLED, like DungeonGateService and unlike XPConfigService. A respawn period
// is a dial the staff turns and watches, and unlike an experience table it can
// change under a running server without anybody receiving a different reward for
// the same act — the monster simply comes back sooner or later.
service SpawnRateService {
  // SpawnRateVersion returns the monotonic version. Asked every few seconds.
  rpc SpawnRateVersion(SpawnRateVersionRequest) returns (SpawnRateVersionResponse);
  // GetSpawnRates returns every touched area. Areas absent from the reply run at
  // exactly the period NPCGener.txt gives each of their blocks.
  rpc GetSpawnRates(GetSpawnRatesRequest) returns (GetSpawnRatesResponse);
}

message SpawnRateVersionRequest {}
message SpawnRateVersionResponse { int64 version = 1; }

message GetSpawnRatesRequest {}
message GetSpawnRatesResponse {
  int64 version = 1;
  repeated SpawnRate areas = 2;
}

// SpawnRate is one area's pacing. `area` is the internal/spawnrate.Area index,
// appended to and never reordered. `percent` multiplies each generator's own
// period, so 100 is the content file untouched and 200 is twice the wait.
message SpawnRate {
  int32 area = 1;
  int32 percent = 2;
}

// CombineRateService serves the Mesa das Máquinas — the panel-managed combine
// rates — to tmServer. The legacy keeps these in CompRate.txt, a file edited by
// hand and read once at boot; this carries the moderator's edits on top of it.
// tmServer only reads. A family or key absent from the reply falls back to the
// file, and the file falls back to the compiled default, so a server with no
// dbServer behaves exactly as before.
service CombineRateService {
  // CombineRateVersion returns the monotonic moderator config version.
  rpc CombineRateVersion(CombineRateVersionRequest) returns (CombineRateVersionResponse);
  // GetCombineRates returns every edited rate and band.
  rpc GetCombineRates(GetCombineRatesRequest) returns (GetCombineRatesResponse);
}

message CombineRateVersionRequest {}
message CombineRateVersionResponse { int64 version = 1; }

message GetCombineRatesRequest {}
message GetCombineRatesResponse {
  int64 version = 1;
  repeated CombineRate rates = 2;
  repeated CombineBand bands = 3;
}

// CombineRate is one key of CompRate.txt: the family (Ailyn, Agatha, Ehre,
// Compositor, …) and the key inside it (ChanceBase, Espiritual, Item_+9, …).
// Ranges 0..100, the same bound the legacy parser enforces on the file.
message CombineRate {
  string family = 1;
  string key = 2;
  int32 rate = 3;
}

// CombineBand is one item band of the +10 machine, which the legacy has no
// notion of: a multiplier over the machine's own rate, chosen by the item's
// ReqLvl.
//
// ReqLvl is the axis because the grade does not separate tiers — 470 of the 654
// weapons share grade 6 — and because weapons and armour concentrate in
// opposite places, which is why the band is per slot_kind rather than one ruler
// for both.
//
// mult_pct is in hundredths so no float crosses the wire: 100 is neutral, 180 is
// 1.8x, 40 is 0.4x. label is the moderator's own name for the band ("Armas C"),
// carried so the panel and the audit log speak the operator's vocabulary.
message CombineBand {
  int32 slot_kind = 1;    // 1 weapon, 2 armour
  int32 req_lvl_min = 2;
  int32 req_lvl_max = 3;
  string label = 4;
  int32 mult_pct = 5;
}

// CombatRuleService serves the combat rule (internal/combatrule) to tmServer:
// how much Magic a weapon draws from INT, whether the percentage damage buffs
// reach spells, and the resist base of a spell against a monster.
//
// POLLED, like SpawnRateService. These are knobs the staff tune by watching a
// fight, and restart-to-apply would charge a disconnect for everyone online per
// turn. tmServer re-derives every online player's score when the rule moves, so
// the new Magic reaches the client window at once.
service CombatRuleService {
  // CombatRuleVersion returns the monotonic version. Asked every few seconds.
  rpc CombatRuleVersion(CombatRuleVersionRequest) returns (CombatRuleVersionResponse);
  // GetCombatRule returns the rule and the version it belongs to.
  rpc GetCombatRule(GetCombatRuleRequest) returns (GetCombatRuleResponse);
}

message CombatRuleVersionRequest {}
message CombatRuleVersionResponse { int64 version = 1; }

message GetCombatRuleRequest {}

// GetCombatRuleResponse is the one rule row. configured=false means nobody has
// saved a rule, and tmServer then runs combatrule.Default() whatever the three
// fields say — they carry the default too, but a reader must not depend on it:
// their zero values are not a rule (a resist base of 0 is outside its range).
message GetCombatRuleResponse {
  int64 version = 1;
  bool configured = 2;
  // 0..100: the share of the weapon's (DEX×k + INT×k)/100 Magic term. 100 is
  // Kersef, 0 leaves Magic to equipment, mount and buffs.
  int32 weapon_int_magic_pct = 3;
  // Whether DAMAGEMULTI (potions, Assalto, Meditação, transforms) multiplies
  // spells too. The legacy applies it to the melee hit only.
  bool spell_damage_multi = 4;
  // 50..150: the constant in a spell's resist scale against a MONSTER,
  // (base − resist/2)%. The legacy is 150; against a player 150 always stays.
  int32 mob_resist_base = 5;
  // 1..200: what is left of a SKILL blow on a PLAYER, applied after the legacy
  // quarter (_MSG_Attack.cpp:1300-1307, "Perfuração"). 100 is the legacy.
  int32 pvp_skill_pct = 6;
  // 1..200: the same for a MELEE blow on a player. 100 is the legacy.
  //
  // Both are outside their range at 0, so a reader may take 0 as "sent by a
  // dbServer that predates these fields" and use the legacy 100 instead.
  int32 pvp_melee_pct = 7;
  // 0..100: the share of INT that counts as DEX in a SKILL's accuracy against
  // dodge; the game uses max(DEX, INT×pct/100). 0 is the legacy (DEX only).
  //
  // `optional`, unlike the fields above: 0 is a real value here, so the PvP
  // trick of reading 0 as "not sent" cannot work. Presence is what tells a
  // saved 0 from a dbServer that predates the field, and tmServer maps an
  // absent field to combatrule.Default() — not to the legacy.
  optional int32 spell_int_accuracy_pct = 8;
  // 0..10: skill misses in a row on the same target before the next one is
  // forced to land. 0 turns it off (the legacy). `optional` for the same reason.
  optional int32 max_miss_streak = 9;
  // 1..3: how many learned evolution skills add the class weapon term (DEX×a +
  // FOR×b) to the melee Damage. 3 is the legacy (once per skill). `optional`
  // so a dbServer that predates it maps to combatrule.Default(), not to 0,
  // which is outside the range and would make the whole rule invalid.
  optional int32 weapon_damage_grants = 10;
}

// NpcGeneratorService is the staff switch per NPCGener block
// (0048_npc_generator_off): a switched-off block generates nothing until it is
// switched back on.
//
// POLLED like DungeonGateService — it is the replacement for the legacy
// "reloadnpc", a change that must land without a restart. Unlike every other
// config service it is also WRITTEN by tmServer: the switch is an in-game GM
// command (/gm npc off|on), the same way /gm ban writes SetAccountBlocked.
service NpcGeneratorService {
  // GeneratorOffVersion returns the monotonic version. Asked every few seconds.
  rpc GeneratorOffVersion(GeneratorOffVersionRequest) returns (GeneratorOffVersionResponse);
  // GetGeneratorsOff returns every switched-off block. Blocks absent from the
  // reply generate as the content says.
  rpc GetGeneratorsOff(GetGeneratorsOffRequest) returns (GetGeneratorsOffResponse);
  // SetGeneratorOff switches one block off or back on, and bumps the version.
  rpc SetGeneratorOff(SetGeneratorOffRequest) returns (SetGeneratorOffResponse);
}

message GeneratorOffVersionRequest {}
message GeneratorOffVersionResponse { int64 version = 1; }

message GetGeneratorsOffRequest {}
message GetGeneratorsOffResponse {
  int64 version = 1;
  repeated GeneratorOff off = 2;
}

// GeneratorOff is one switched-off block. `index` is its position in
// NPCGener.txt (Entity.GenIndex); `by` is who switched it off.
message GeneratorOff {
  int32 index = 1;
  string by = 2;
}

message SetGeneratorOffRequest {
  int32 index = 1;
  bool off = 2;
  // The account that ran the command, kept on the row for "who did this".
  string by = 3;
}
message SetGeneratorOffResponse {}
// DropRuleService serves the Mesa de Drops (internal/droprule) to tmServer: the
// exact chance, set in the panel, for one item to fall from one monster. A rule
// for (monster, item) replaces what the monster's template does with that item;
// monster "*" takes an item off every monster and only at 0%.
//
// POLLED, like CombatRuleService: the table is built before launch by watching
// the game, and restart-to-apply would cost a disconnect per line.
service DropRuleService {
  // DropRuleVersion returns the monotonic version. Asked every few seconds.
  rpc DropRuleVersion(DropRuleVersionRequest) returns (DropRuleVersionResponse);
  // ListDropRules returns every rule and the version they belong to.
  rpc ListDropRules(ListDropRulesRequest) returns (ListDropRulesResponse);
}

message DropRuleVersionRequest {}
message DropRuleVersionResponse { int64 version = 1; }

message ListDropRulesRequest {}

message DropRule {
  // The template file name (Release/TMsrv/run/npc), or "*" for every monster.
  string mob = 1;
  int32 item = 2;
  // Hundredths of a percent, 0..10000 (800 = 8%).
  int32 chance = 3;
}

message ListDropRulesResponse {
  int64 version = 1;
  repeated DropRule rules = 2;
}
